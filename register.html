<script>
function showCustomToast(message,type='error'){
  const container=document.getElementById('toastContainer');
  const toast=document.createElement('div');
  toast.className='toast '+type;
  let icon='❌';
  if(type==='success') icon='✅';
  if(type==='warning') icon='⚠️';
  if(type==='info') icon='ℹ️';
  toast.innerHTML=icon+' '+message;
  container.appendChild(toast);
  setTimeout(()=>toast.remove(),3000);
}

function isEgyptianPhone(phone){
  let cleanPhone=phone.replace(/\s+/g,'').replace(/[^\d+]/g,'');
  const patterns=[
    /^01[0-9]{9}$/,
    /^\+201[0-9]{9}$/,
    /^00201[0-9]{9}$/
  ];
  return patterns.some(pattern=>pattern.test(cleanPhone));
}

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function convertToFirebaseEmail(input){
  if(input.includes('@')&&isValidEmail(input)) return input;

  let cleanInput=input.replace(/\s+/g,'').replace(/[^\d+]/g,'');
  if(!isEgyptianPhone(cleanInput)) return null;

  let digitsOnly=cleanInput.replace(/\D/g,'');
  if(digitsOnly.length===11&&digitsOnly.startsWith('01')){
    return digitsOnly+'@pharacoinsupport.com';
  }else if(digitsOnly.length===12&&digitsOnly.startsWith('201')){
    return '0'+digitsOnly.substring(2)+'@pharacoinsupport.com';
  }
  return null;
}

const urlParams=new URLSearchParams(window.location.search);
const referrerId=urlParams.get('ref');

const captchaNum1=Math.floor(Math.random()*10)+1;
const captchaNum2=Math.floor(Math.random()*10)+1;
document.getElementById("captchaQuestion").innerText=`${captchaNum1} + ${captchaNum2} = ?`;
const captchaResult=captchaNum1+captchaNum2;

document.querySelectorAll(".eye").forEach(function(eye){
  eye.addEventListener("click",function(){
    let input=this.parentElement.querySelector("input");
    if(input.type==="password"){
      input.type="text";
      this.textContent="🙈";
    }else{
      input.type="password";
      this.textContent="👁️";
    }
  });
  eye.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){
      e.preventDefault();
      this.click();
    }
  });
});

const passwordInput=document.getElementById("password");
const strengthBar=document.querySelector(".strength span");

passwordInput.addEventListener("input",function(){
  let value=passwordInput.value;
  let strength=0;
  if(value.length>=6) strength++;
  if(/[A-Z]/.test(value)) strength++;
  if(/[0-9]/.test(value)) strength++;
  if(/[^A-Za-z0-9]/.test(value)) strength++;
  strengthBar.style.width=(strength*25)+"%";
  strengthBar.style.background=["red","orange","gold","lime"][strength-1]||"red";
});

firebase.initializeApp({
  apiKey:"AIzaSyB78JT_cbPMizvzKWBrQoQUe3-zukHrr1U",
  authDomain:"pharacoin.firebaseapp.com",
  projectId:"pharacoin"
});

const auth=firebase.auth();
const db=firebase.firestore();

document.getElementById("registerForm").addEventListener("submit",function(e){
  e.preventDefault();

  const userAnswer=parseInt(document.getElementById("captchaAnswer").value);
  if(userAnswer!==captchaResult){
    showCustomToast('The security answer is incorrect. Please try again.','error');
    return;
  }

  const username=document.getElementById("username").value;
  const emailOrPhone=document.getElementById("emailOrPhone").value;
  const password=document.getElementById("password").value;
  const confirmPassword=document.getElementById("confirmPassword").value;

  if(password!==confirmPassword){
    showCustomToast('Passwords do not match.','error');
    return;
  }

  if(password.length<6){
    showCustomToast('Password must be at least 6 characters long.','error');
    return;
  }

  const firebaseEmail=convertToFirebaseEmail(emailOrPhone);

  if(!firebaseEmail){
    showCustomToast('Please enter a valid email address or Egyptian phone number.','error');
    return;
  }

  const submitBtn=e.target.querySelector('button[type="submit"]');
  submitBtn.disabled=true;
  submitBtn.style.opacity='0.7';
  submitBtn.innerText='Creating Account...';

  auth.createUserWithEmailAndPassword(firebaseEmail,password)
    .then((userCredential)=>{
      const user=userCredential.user;

      const userData={
        username:username,
        emailOrPhone:emailOrPhone,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),
        coins:1000,
        xp:0,
        vipPlan:null,
        vipExpire:null
      };

      if(referrerId&&referrerId!==user.uid){
        userData.referredBy=referrerId;
      }

      return db.collection("users").doc(user.uid).set(userData)
        .then(async()=>{
          if(referrerId&&referrerId!==user.uid){
            try{
              await db.collection("users").doc(referrerId).update({
                referralCount:firebase.firestore.FieldValue.increment(1)
              });
              await db.collection("users").doc(referrerId).update({
                coins:firebase.firestore.FieldValue.increment(10)
              });
            }catch(refError){
              console.error("Referral update error:",refError);
            }
          }

          localStorage.setItem("loginEmail",emailOrPhone);
          localStorage.setItem("loginPass",password);

          showCustomToast('Registration successful! Welcome to the world of the Pharaohs 🏺','success');

          setTimeout(()=>{
            window.location.href="login.html";
          },1500);
        });
    })
    .catch((error)=>{
      submitBtn.disabled=false;
      submitBtn.style.opacity='1';
      submitBtn.innerText='Create Account';

      let errorMessage='An error occurred during registration.';
      if(error.code==='auth/email-already-in-use'){
        errorMessage='This phone number or email is already registered. Please log in.';
      }else if(error.code==='auth/invalid-email'){
        errorMessage='The email address format is invalid.';
      }else if(error.code==='auth/weak-password'){
        errorMessage='Password is too weak. It must be at least 6 characters long.';
      }else{
        errorMessage=error.message;
      }
      showCustomToast(errorMessage,'error');
    });
});

function goBack(){
  if(document.referrer){
    history.back();
  }else{
    location.href="index.html";
  }
}
</script>
