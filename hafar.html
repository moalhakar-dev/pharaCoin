<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>الحفار الفرعوني • أسطورة الكنز 4000$</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        .bg {
            position: fixed; inset: 0;
            background: url("Object/qa.jpg") center/cover no-repeat;
            filter: brightness(0.25) saturate(1.2);
            z-index: -2;
        }
        .bg::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(255,215,0,0.08) 0%, transparent 60%);
        }
        .particles {
            position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
        }
        .particle {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.8), transparent);
            animation: particleRise linear infinite; opacity: 0;
        }
        @keyframes particleRise {
            0% { opacity: 0; transform: translateY(100vh) scale(0); }
            10% { opacity: 1; transform: scale(1); }
            90% { opacity: 0.5; }
            100% { opacity: 0; transform: translateY(-10vh) scale(0.5); }
        }

        .game-container {
            position: relative;
            margin-top: 40px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .game-title {
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(180deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            filter: drop-shadow(0 0 10px #ff4500);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .event-badge {
            display: inline-block;
            background: rgba(255,215,0,0.15);
            border: 1px solid gold;
            border-radius: 20px;
            padding: 4px 16px;
            color: gold;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .progress-card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255,215,0,0.5);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 25px;
            width: 100%;
            text-align: center;
        }
        .stars-label { font-size: 18px; color: #ddd; margin-bottom: 5px; }
        .stars-count {
            font-size: 40px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 15px #ff4500;
            line-height: 1.2;
        }
        .stars-target { font-size: 14px; color: #aaa; }
        .progress-bar {
            height: 12px;
            background: #222;
            border-radius: 10px;
            margin: 15px 0 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FF4500);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .round-stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .round-stat {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 15px;
            padding: 8px 18px;
            text-align: center;
            min-width: 80px;
        }
        .round-stat .value { font-size: 22px; font-weight: 900; color: #FFD700; }
        .round-stat .label { font-size: 12px; color: #aaa; }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 10px;
            justify-content: center;
        }
        .cell {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #2c1a0a, #110a00);
            border: 2px solid #B8860B;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 8px rgba(255,215,0,0.3);
            user-select: none;
        }
        .cell.revealed {
            background: #1a1000;
            cursor: default;
            border-color: #FFD700;
            box-shadow: 0 0 15px gold;
        }
        .cell:not(.revealed):hover {
            border-color: #FFD700;
            box-shadow: 0 0 20px gold;
            transform: scale(1.05);
        }

        .message {
            font-size: 18px;
            margin: 20px 0 10px;
            min-height: 30px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 40px;
            font-family: 'Cairo';
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px gold; }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-glow {
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #000;
            box-shadow: 0 0 25px gold, 0 0 50px #FF4500;
            animation: depositGlow 1.5s infinite alternate;
            font-size: 16px;
            padding: 14px 28px;
        }
        @keyframes depositGlow {
            from { box-shadow: 0 0 20px gold, 0 0 40px #FF4500; }
            to { box-shadow: 0 0 35px gold, 0 0 70px #FF4500; }
        }
        .btn-outline {
            background: transparent;
            border: 2px solid gold;
            color: gold;
        }
        .btn-outline:hover { background: rgba(255,215,0,0.1); }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            border: 1px solid gold;
            border-radius: 30px;
            padding: 10px 25px;
            color: gold;
            font-weight: bold;
            z-index: 999;
            animation: fadeToast 3s forwards;
            white-space: nowrap;
        }
        @keyframes fadeToast {
            0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; }
        }
    </style>
</head>
<body>
<div class="bg"></div>
<div class="particles" id="particles"></div>

<div class="game-container">
    <div class="game-header">
        <div class="game-title">⛏️ الحفار الفرعوني</div>
        <div class="subtitle">اكشف الكنوز واجمع النجوم</div>
        <a href="event-4000.html" class="event-badge">🔥 أسطورة الكنز 4000$</a>
    </div>

    <div class="progress-card">
        <div class="stars-label">⭐ النجوم المجمعة</div>
        <div class="stars-count"><span id="totalStarsDisplay">0</span> / 100</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="stars-target" id="goalMessage">اجمع 100 نجمة لفتح الجائزة الكبرى</div>
    </div>

    <div class="round-stats">
        <div class="round-stat">
            <div class="value" id="treasureCount">0/5</div>
            <div class="label">🏺 كنوز</div>
        </div>
        <div class="round-stat">
            <div class="value" id="livesCount">3</div>
            <div class="label">❤️ أرواح</div>
        </div>
        <div class="round-stat">
            <div class="value" id="sessionStars">0</div>
            <div class="label">🌟 جولة</div>
        </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="message" id="message"></div>

    <div class="actions">
        <button class="btn btn-primary" id="restartBtn">🔄 جاري التحميل...</button>
        <button class="btn btn-primary" id="claimBtn" disabled>🎁 فتح الجائزة</button>
        <a href="event-4000.html" class="btn btn-outline">🔥 صفحة الحدث</a>
        <a href="dashboard.html" class="btn btn-outline">🏠 لوحة التحكم</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB78JT_cbPMizvzKWBrQoQUe3-zukHrr1U",
        authDomain: "pharacoin.firebaseapp.com",
        projectId: "pharacoin"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, dur, type = 'sine', vol = 0.1) {
        if (!audioCtx) return;
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start(); o.stop(audioCtx.currentTime + dur);
    }
    function playDigSound() { playTone(150, 0.15, 'square', 0.08); }
    function playTreasureSound() {
        playTone(523, 0.15, 'sine', 0.12);
        setTimeout(() => playTone(659, 0.15, 'sine', 0.12), 100);
        setTimeout(() => playTone(784, 0.2, 'sine', 0.12), 200);
    }
    function playSnakeSound() { playTone(80, 0.3, 'sawtooth', 0.1); }
    function playWinSound() {
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'sine', 0.1), i * 150));
    }
    function playLoseSound() {
        [400, 350, 300, 200].forEach((f, i) => setTimeout(() => playTone(f, 0.25, 'triangle', 0.1), i * 200));
    }

    const ATTEMPT_FEE = 200;
    const STARS_PER_TREASURE = 2;
    const REQUIRED_STARS = 100;
    const REQUIRED_ATTEMPTS = 5;

    let currentUser = null;
    let userDocRef = null;
    let userBalance = 0;
    let totalStars = 0;
    let paidAttempts = 0;
    let totalDeposits = 0; // إجمالي الإيداعات

    let gameActive = false;
    let treasuresFound = 0;
    let lives = 3;
    let sessionStars = 0;
    let board = [];

    const totalStarsDisplay = document.getElementById('totalStarsDisplay');
    const progressFill = document.getElementById('progressFill');
    const goalMessage = document.getElementById('goalMessage');
    const treasureCountEl = document.getElementById('treasureCount');
    const livesCountEl = document.getElementById('livesCount');
    const sessionStarsEl = document.getElementById('sessionStars');
    const gridEl = document.getElementById('grid');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restartBtn');
    const claimBtn = document.getElementById('claimBtn');

    function createBoard() {
        const cells = new Array(16).fill(null).map(() => ({ type: 'empty', revealed: false }));
        for (let i = 0; i < 5; i++) {
            let idx;
            do { idx = Math.floor(Math.random() * 16); } while (cells[idx].type !== 'empty');
            cells[idx].type = 'treasure';
        }
        for (let i = 0; i < 5; i++) {
            let idx;
            do { idx = Math.floor(Math.random() * 16); } while (cells[idx].type !== 'empty');
            cells[idx].type = 'snake';
        }
        return cells;
    }

    function renderBoard() {
        gridEl.innerHTML = '';
        board.forEach((cell, i) => {
            const div = document.createElement('div');
            div.className = 'cell';
            if (cell.revealed) {
                div.classList.add('revealed');
                div.textContent = cell.type === 'treasure' ? '🏺' : cell.type === 'snake' ? '🐍' : '';
            } else {
                div.textContent = '🔲';
            }
            div.addEventListener('click', () => handleCellClick(i));
            gridEl.appendChild(div);
        });
    }

    function updateUI() {
        totalStarsDisplay.textContent = totalStars;
        const progress = Math.min((totalStars / REQUIRED_STARS) * 100, 100);
        progressFill.style.width = progress + '%';

        if (totalStars >= REQUIRED_STARS && paidAttempts >= REQUIRED_ATTEMPTS) {
            goalMessage.textContent = '🏆 أنت مؤهل للجائزة! اضغط "فتح الجائزة"';
            goalMessage.style.color = '#FFD700';
        } else if (totalStars >= REQUIRED_STARS) {
            goalMessage.textContent = '⭐ لديك نجوم كافية! تابع اللعب لاستيفاء الشروط';
            goalMessage.style.color = '#FFA500';
        } else {
            goalMessage.textContent = `تبقى ${REQUIRED_STARS - totalStars} نجمة للوصول للهدف`;
            goalMessage.style.color = '#aaa';
        }

        treasureCountEl.textContent = treasuresFound + '/5';
        livesCountEl.textContent = lives;
        sessionStarsEl.textContent = sessionStars;

        claimBtn.disabled = !(totalStars >= REQUIRED_STARS && paidAttempts >= REQUIRED_ATTEMPTS);
        updateButtonState();
    }

    function checkDepositIncrease() {
        const lastDeposits = parseFloat(localStorage.getItem('lastDeposits') || '0');
        return (totalDeposits - lastDeposits) >= ATTEMPT_FEE;
    }

    function updateButtonState() {
        const freeUsed = localStorage.getItem('firstAttemptUsed') === 'true';
        const lost = localStorage.getItem('gameLost') === 'true';

        if (!freeUsed) {
            restartBtn.textContent = '🎮 ابدأ اللعبة مجاناً';
            restartBtn.className = 'btn btn-primary';
            restartBtn.onclick = startFirstAttempt;
            restartBtn.disabled = false;
        } else if (lost && !checkDepositIncrease()) {
            restartBtn.textContent = '💳 إيداع للمتابعة (200 جنيه)';
            restartBtn.className = 'btn btn-glow';
            restartBtn.onclick = () => window.location.href = 'deposit.html';
            restartBtn.disabled = false;
        } else {
            restartBtn.textContent = '🔄 محاولة جديدة (200 جنيه)';
            restartBtn.className = 'btn btn-primary';
            restartBtn.onclick = handlePaidAttempt;
            restartBtn.disabled = false;
        }
    }

    function endRound(won) {
        if (!gameActive) return;
        gameActive = false;

        // تعليم أن المحاولة الأولى استُخدمت
        localStorage.setItem('firstAttemptUsed', 'true');

        if (won) {
            messageEl.textContent = `🎉 رائع! جمعت ${sessionStars} نجمة في هذه الجولة.`;
            playWinSound();
            updateDoc(userDocRef, { totalStars: increment(sessionStars) }).then(() => {
                totalStars += sessionStars;
                updateUI();
            });
        } else {
            messageEl.textContent = '💀 انتهت الجولة! يجب الإيداع للمحاولة التالية.';
            playLoseSound();
            board.forEach(c => c.revealed = true);
            renderBoard();
            // تسجيل الخسارة
            localStorage.setItem('lastDeposits', totalDeposits);
            localStorage.setItem('gameLost', 'true');
            showToast('💪 لا تيأس! يمكنك المحاولة مرة أخرى بعد الإيداع.');
        }
        updateButtonState();
    }

    function startFirstAttempt() {
        // بدء المحاولة المجانية الأولى
        board = createBoard();
        treasuresFound = 0;
        lives = 3;
        sessionStars = 0;
        gameActive = true;
        messageEl.textContent = '';
        updateUI();
        renderBoard();
        initAudio();
    }

    async function handlePaidAttempt() {
        if (!currentUser) return showToast('يجب تسجيل الدخول أولاً');

        if (localStorage.getItem('gameLost') === 'true' && !checkDepositIncrease()) {
            showToast('يجب إيداع 200 جنيه على الأقل للمتابعة');
            window.location.href = 'deposit.html';
            return;
        }

        if (userBalance < ATTEMPT_FEE) {
            showToast('⚠️ رصيدك غير كافٍ. سيتم توجيهك إلى صفحة الإيداع.');
            setTimeout(() => window.location.href = 'deposit.html', 1500);
            return;
        }
        try {
            await updateDoc(userDocRef, {
                coins: increment(-ATTEMPT_FEE),
                paidAttempts: increment(1)
            });
            userBalance -= ATTEMPT_FEE;
            paidAttempts++;
            showToast('🔄 بدأت محاولة جديدة! تم خصم 200 جنيه.');
            startRound();
        } catch (e) {
            showToast('❌ حدث خطأ، حاول لاحقاً');
        }
    }

    function startRound() {
        board = createBoard();
        treasuresFound = 0;
        lives = 3;
        sessionStars = 0;
        gameActive = true;
        messageEl.textContent = '';
        updateUI();
        renderBoard();
        initAudio();
    }

    function handleCellClick(index) {
        if (!gameActive) return;
        const cell = board[index];
        if (cell.revealed) return;
        initAudio(); playDigSound();
        cell.revealed = true;
        renderBoard();
        if (cell.type === 'treasure') {
            treasuresFound++;
            sessionStars += STARS_PER_TREASURE;
            updateUI();
            playTreasureSound();
            if (treasuresFound >= 5) {
                endRound(true);
            }
        } else if (cell.type === 'snake') {
            lives--;
            updateUI();
            playSnakeSound();
            if (lives <= 0) {
                endRound(false);
            }
        }
    }

    async function claimReward() {
        if (totalStars < REQUIRED_STARS || paidAttempts < REQUIRED_ATTEMPTS) return;
        try {
            await updateDoc(userDocRef, { coins: increment(10000), totalStars: 0 });
            userBalance += 10000;
            totalStars = 0;
            updateUI();
            showToast('🎁 مبروك! تمت إضافة 10,000 جنيه إلى حسابك.');
            setTimeout(() => window.location.href = 'event-4000.html', 2000);
        } catch (e) {
            showToast('❌ فشلت العملية');
        }
    }

    function showToast(msg) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        currentUser = user;
        userDocRef = doc(db, "users", user.uid);
        const snap = await getDoc(userDocRef);
        if (!snap.exists()) {
            await setDoc(userDocRef, { coins: 500, totalStars: 0, paidAttempts: 0, totalDeposits: 0 });
            userBalance = 500; totalStars = 0; paidAttempts = 0; totalDeposits = 0;
        } else {
            const d = snap.data();
            userBalance = d.coins || 0;
            totalStars = d.totalStars || 0;
            paidAttempts = d.paidAttempts || 0;
            totalDeposits = d.totalDeposits || 0;
        }
        onSnapshot(userDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const d = docSnap.data();
                userBalance = d.coins || 0;
                totalStars = d.totalStars || 0;
                paidAttempts = d.paidAttempts || 0;
                totalDeposits = d.totalDeposits || 0;
                updateUI();
            }
        });
        updateUI();
        // لا نبدأ اللعبة تلقائياً؛ الزر هو من يبدأ
    });

    // ربط الأحداث الأساسية
    restartBtn.addEventListener('click', () => {
        // سيتم استبدال هذا عن طريق updateButtonState
        const freeUsed = localStorage.getItem('firstAttemptUsed') === 'true';
        if (!freeUsed) startFirstAttempt();
        else handlePaidAttempt();
    });
    claimBtn.addEventListener('click', claimReward);

    (function initParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 20; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (8 + Math.random() * 12) + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            p.style.width = (2 + Math.random() * 4) + 'px';
            p.style.height = p.style.width;
            container.appendChild(p);
        }
    })();
</script>
</body>
</html>
